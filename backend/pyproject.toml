[project]
name = "ion-design"
version = "0.1.0"
description = "Le design de la famille Ion : identit\u00e9 visuelle, mise en page, typographie, mouvement, finitions."
license = "MIT"
requires-python = ">=3.14"
dependencies = []

# The installed command: `uv run ion-design` in backend/, or `uv tool install --editable backend`.
[project.scripts]
ion-design = "ion_design.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ion_design"]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.2,<0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["ion_design"]
